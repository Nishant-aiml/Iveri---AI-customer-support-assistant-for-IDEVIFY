<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="40%" stop-color="#312E81" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Outer Glow Ring -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Headset Gradient -->
    <linearGradient id="headset-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ring-grad)" stroke-width="6" opacity="0.6" />

  <!-- Headset Arch Band -->
  <path d="M 140 250 A 120 120 0 0 1 372 250" fill="none" stroke="url(#headset-grad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Robot Head / Helmet Base (Soft Pearl) -->
  <rect x="156" y="160" width="200" height="175" rx="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" />
  
  <!-- Inner Visor Glass Area -->
  <rect x="176" y="188" width="160" height="105" rx="35" fill="url(#visor-grad)" />

  <!-- Visor Specular Glass Reflection Highlight -->
  <path d="M 190 200 Q 256 195 322 200 Q 256 215 190 200 Z" fill="#FFFFFF" opacity="0.15" />

  <!-- Glowing Cyan AI Eyes (Friendly Curved Cheerful Expression) -->
  <!-- Left Eye -->
  <ellipse cx="218" cy="238" rx="16" ry="20" fill="url(#cyan-glow)" filter="url(#glow-strong)" />
  <circle cx="222" cy="232" r="5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="294" cy="238" rx="16" ry="20" fill="url(#cyan-glow)" filter="url(#glow-strong)" />
  <circle cx="298" cy="232" r="5" fill="#FFFFFF" />

  <!-- Friendly Glowing Smile Line -->
  <path d="M 236 266 Q 256 278 276 266" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />

  <!-- Headset Ear Cushions -->
  <!-- Left Earcup -->
  <rect x="130" y="215" width="28" height="65" rx="12" fill="#1E293B" stroke="url(#headset-grad)" stroke-width="4" />
  <!-- Right Earcup -->
  <rect x="354" y="215" width="28" height="65" rx="12" fill="#1E293B" stroke="url(#headset-grad)" stroke-width="4" />

  <!-- Support Headset Mic Arm & Glowing Tip -->
  <path d="M 364 265 Q 360 325 305 330" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round" />
  <circle cx="300" cy="330" r="12" fill="#0F172A" stroke="#22D3EE" stroke-width="3" />
  <circle cx="300" cy="330" r="5" fill="#22D3EE" filter="url(#glow)" />

  <!-- Chest / Neck Base with Sleek Lighting -->
  <path d="M 180 345 L 332 345 L 370 410 Q 256 425 142 410 Z" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <!-- Core Indicator Badge -->
  <rect x="232" y="365" width="48" height="8" rx="4" fill="url(#cyan-glow)" filter="url(#glow)" />

  <!-- Floating Sparkle Stars / Knowledge Nodes -->
  <circle cx="110" cy="150" r="4" fill="#38BDF8" opacity="0.7" filter="url(#glow)" />
  <circle cx="405" cy="140" r="5" fill="#A855F7" opacity="0.7" filter="url(#glow)" />
  <circle cx="95" cy="340" r="3.5" fill="#22D3EE" opacity="0.6" />
  <circle cx="420" cy="330" r="4" fill="#818CF8" opacity="0.6" />
</svg>
