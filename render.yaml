services:
  - type: web
    name: iveri-customer-support-assistant
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/idevify.db
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_LLM_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: FIREBASE_PROJECT_ID
        value: idevify-2d7f1
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./data/chroma_db
      - key: UPLOAD_DIRECTORY
        value: ./data/uploads
      - key: ALLOWED_ORIGINS
        value: "*"
