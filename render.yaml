databases:
  - name: idevify-db
    databaseName: idevify_db
    user: idevify
    plan: free
    region: oregon

services:
  - type: web
    name: iveri-customer-support-assistant
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: idevify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./chroma_db
      - key: UPLOAD_DIRECTORY
        value: ./uploads
      - key: ALLOWED_ORIGINS
        value: "*"
